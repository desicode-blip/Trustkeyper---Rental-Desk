/* ===== Share a home the TK2 way. Same message and the same public link TK2's demo build makes
   (trustkeyper-tk2-staging.web.app/#p-…): only public facts ride in the link; never the flat number, owner or keys. ===== */
const TK2_WEB='https://trustkeyper-tk2-staging.web.app/';
function tk2Base32(text){const abc='abcdefghijklmnopqrstuvwxyz234567';let out='',v=0,bits=0;for(const b of new TextEncoder().encode(text)){v=(v<<8)|b;bits+=8;while(bits>=5){out+=abc[(v>>(bits-5))&31];bits-=5;}v&=(1<<bits)-1;}if(bits>0)out+=abc[(v<<(5-bits))&31];return out;}
function tk2Payload(o){const pp=prepare(o),d=leadDetails(o);const num=x=>{const n=money(x);return n==null?0:Math.round(n);};const furn=pp.furnishing==='fully'?'Fully furnished':pp.furnishing==='semi'?'Semi-furnished':'Unfurnished';
 const mm=o.maintenanceMode||d.maintenanceMode||'';const area=o.locality||areaFor(o.society)||'';const photos=(o.photoList||[]).map(x=>x&&x.url).filter(u=>/^https:/.test(u||'')).slice(0,10);
 const me=S.profile||{};const who=String(d.whoCanRent||'').split(',').map(s=>s.trim()).filter(Boolean);
 return {id:'rd-'+String(o.id).slice(-10),t:(o.society||area||'Home in Hyderabad').trim(),a:[o.society,area].filter(Boolean).join(', '),r:pp.beds?(pp.beds===0.5?'1 RK':pp.beds+' BHK'):(o.requirement||''),rent:pp.amount||0,mi:mm==='extra'?0:1,...(o.rentNegotiable==='yes'?{rn:1}:{}),m:mm==='extra'?num(o.maintenanceText):0,d:num(o.deposit),b:0,bd:0,f:furn,...(num(o.area)?{s:num(o.area)}:{}),fl:parseInt(o.floor,10)||0,tf:parseInt(o.totalFloors,10)||0,...(o.facing?{fc:o.facing}:{}),w:who.length&&!who.includes('anyone')?who.join(', '):'Anyone',pt:pp.pets==='no'?0:1,av:date(o.availableFrom)?shownDate(o.availableFrom):(o.availableFrom||''),vd:'all',vf:7,vt:23,fee:0,...(photos.length?{ph:photos}:{}),bn:'TrustKeyper'+(me.name?' · '+me.name:''),...(me.phone?{bp:me.phone}:{})};}
function tk2Link(o){return TK2_WEB+'#p-'+tk2Base32(JSON.stringify(tk2Payload(o)));}
const HOME_WEB=location.origin+'/h/';
function visitWindows(o){const to24=(h,a)=>{h=+h;if(!h&&h!==0)return null;if(a==='PM'&&h<12)h+=12;if(a==='AM'&&h===12)h=0;return h;};return vtParse(o.visitTimes).map(s=>[to24(s.f,s.fa),to24(s.t,s.ta)]).filter(([a,b])=>a!=null&&b!=null&&b>a);}
async function makeShare(t,o){const sid=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');const p=tk2Payload(o);const win=visitWindows(o);if(win.length)p.win=win;const bk=brokerageValue(t);if(bk)p.bk=bk;
 await fdb.doc('shares/'+sid).set({tid:t.id,pid:o.id,p,by:String(FB.user?.email||''),at:new Date().toISOString()});return HOME_WEB+sid;}
function homeShareText(o,link){return tk2ShareText(o).replace(/https:\/\/trustkeyper-tk2-staging\.web\.app\/#p-[a-z2-7]+/,link);}
function tk2ShareText(o){const pp=prepare(o),pl=tk2Payload(o);const facts=[pl.r,pl.f,pl.s?pl.s+' sft':''].filter(Boolean).join(' · ');const rs=x=>'₹'+Number(x).toLocaleString('en-IN');
 return ['🏠 '+pl.t,(o.locality||areaFor(o.society))?'📍 '+(o.locality||areaFor(o.society)):'',facts,pl.rent?'Rent '+rs(pl.rent)+(pl.mi?'':' + '+rs(pl.m)+' maintenance')+(pl.rn?' (negotiable)':'')+(pl.d?' · Deposit '+rs(pl.d):''):'',pl.w&&pl.w!=='Anyone'?'For '+pl.w:'',pl.pt?'':'No pets','Available '+(pl.av?'from '+pl.av:'now'),'','See photos and book a visit (free):',tk2Link(o),'','– '+pl.bn+(pl.bp?', '+pl.bp:'')].filter((x,i,a)=>x!==''||(a[i-1]!=='')).join('\n');}

/* ===== Tenant link activity → match workspace. Each visit/reply is written once into the tenant's homes (stage + log). ===== */
const VSTAT={booked:'Visit booked',cancelled:'Visit cancelled by tenant',visited:'Tenant says they visited'};
function visitsFor(tid,pid){return (S.visits||[]).filter(v=>v.tid===tid&&(!pid||v.pid===pid)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));}
async function foldVisits(){if(!S.loaded||S.folding)return;S.folding=true;try{
 for(const v of S.visits||[]){const key=[v.status,v.liked||'',v.done?'d':''].join('|');if(v.seen===key)continue;const t=S.byId.get(v.tid),o=S.byId.get(v.pid);if(!t){continue;}
  const st=(t.shortlist||{})[v.pid]||{};const stage=v.liked==='yes'?'interested':v.status==='visited'||v.done?'visited':v.status==='booked'?'visit':st.stage||'shared';
  const txt=v.liked?(v.liked==='yes'?'Tenant liked '+homeName(o||{})+' after the visit':'Tenant says '+homeName(o||{})+' is not for them'):VSTAT[v.status]+(v.status==='booked'?' for '+new Date(v.at).toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'');
  const keepStage=stageIx(st.stage)>stageIx(stage)&&!(v.liked==='no');
  await mWrite(t.id,x=>({shortlist:{...(x.shortlist||{}),[v.pid]:{...st,added:st.added||'auto',stage:keepStage?st.stage:stage,...(v.status==='booked'?{visitAt:String(v.at).slice(0,16)}:{}),...(v.liked?{liked:v.liked}:{})}}}),txt,{pid:v.pid,vid:v.id});
  try{await fdb.doc('visits/'+v.id).update({seen:key});}catch(e){}}
 for(const r of S.replies||[]){if(r.seen)continue;const t=S.byId.get(r.tid),o=S.byId.get(r.pid);if(!t)continue;await mWrite(t.id,x=>({}),'Tenant tapped "Not for me" on '+homeName(o||{}),{pid:r.pid});try{await fdb.doc('replies/'+r.id).update({seen:true});}catch(e){}}
}finally{S.folding=false;}}
function visitLine(t,o){const v=visitsFor(t.id,o.id)[0];if(!v)return '';const at=new Date(v.at);const when=at.toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});const id=esc(v.id);
 if(v.status==='cancelled')return `<p class="vline off">${icon('calendar-x')}Visit on ${when} was cancelled by the tenant</p>`;
 return `<p class="vline">${icon('calendar-check')}<span><b>Visit ${v.done?'done':'booked'}</b> · ${when} · <span class="nodict">${esc(v.name)}</span>${v.liked?` · ${v.liked==='yes'?'<b class="good">Liked it</b>':'Not for them'}`:''}</span>${!v.done?`<button class="btn link" data-act="vdone" data-id="${esc(t.id)}" data-vid="${id}">Mark visit done</button>`:''}</p>`;}

async function backfillAreas(){const todo=S.leads.filter(l=>JSON.stringify(l.areaKeys||null)!==JSON.stringify(leadAreaKeys(l)));if(!todo.length)return;let b=fdb.batch(),n=0;for(const l of todo){b.update(fdb.doc('leads/'+docKey(l.id)),{areaKeys:leadAreaKeys(l)});if(++n%400===0){await b.commit();b=fdb.batch();}}await b.commit();dbg('areas backfilled',n);}
/* Admin desk keeps each lead's viewers list in step with Team access (the security rules read it).
   Same logic as the leadViewers function, which takes over if the backend gets database access. */
function viewersOf(l){return Object.entries(S.access||{}).filter(([e,a])=>seesLead(a,l)).map(([e])=>e.toLowerCase()).sort();}
async function reconcileViewers(){if(!FB.admin||!S.loaded||!S.access||S.reconciling)return;S.reconciling=true;try{
 let b=fdb.batch(),n=0;const tv=new Map();const flush=async()=>{if(n%400===0&&n){await b.commit();b=fdb.batch();}};
 for(const l of S.leads){const v=viewersOf(l);if(l.kind==='tenant')tv.set(l.id,v);if(JSON.stringify([...(l.viewers||[])].sort())===JSON.stringify(v)&&Array.isArray(l.viewers))continue;b.update(fdb.doc('leads/'+docKey(l.id)),{viewers:v});n++;await flush();}

 if(!bad.length)return;repairing=true;
 for(const l of bad){const {addedAt,...rest}=l;try{await S.db.doc('leads/'+docKey(l.id)).set(clean(rest));}catch(e){break;}}

}
