<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustKeyper Rental Desk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0f6b55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
 /* Layout: fixed left rail with five work areas; main column of lead cards, tenant cards pair with up to three homes on the right. */
 --bg:#f3f5f4; --surface:#ffffff; --ink:#15211d; --muted:#5d6b66; --line:#dbe3df;
 --accent:#0f6b55; --accent-soft:#e3f1ec; --accent-ink:#ffffff;
 --red:#b3261e; --red-l1:#fbe3e1; --red-soft:#fdf1f0; --green-soft:#eef7f2; --green-line:#b9dcc9;
 --amber:#8a5a00; --amber-soft:#fff4dc; --blue:#2d5bd7; --blue-soft:#e9efff; --grey-soft:#eef0ef;
 --display:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1513; --surface:#17201d; --ink:#e7eeeb; --muted:#9db0a9; --line:#2b3934;
 --accent:#4cc39f; --accent-soft:#183a30; --accent-ink:#06231b;
 --red:#ff8a80; --red-l1:#4a1f1c; --red-soft:#33201e; --green-soft:#16302a; --green-line:#2f5a49;
 --amber:#f2c467; --amber-soft:#3a2f17; --blue:#9bb4ff; --blue-soft:#1e2a4a; --grey-soft:#222c29; color-scheme:dark;}}
:root[data-theme="dark"]{
 --bg:#0f1513; --surface:#17201d; --ink:#e7eeeb; --muted:#9db0a9; --line:#2b3934;
 --accent:#4cc39f; --accent-soft:#183a30; --accent-ink:#06231b;
 --red:#ff8a80; --red-l1:#4a1f1c; --red-soft:#33201e; --green-soft:#16302a; --green-line:#2f5a49;
 --amber:#f2c467; --amber-soft:#3a2f17; --blue:#9bb4ff; --blue-soft:#1e2a4a; --grey-soft:#222c29; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.brandmark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:11px 12px;border-radius:10px;font-size:16px;font-weight:500;text-align:left}
.nav button:hover{background:var(--grey-soft)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav b{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;padding:1px 8px;font-size:13px;text-align:center}
.railfoot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dot.warn{background:var(--red)}
main{padding:24px clamp(16px,3vw,36px) 80px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--display);font-size:30px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;gap:7px;align-items:center;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red)}
.btn.link{border:0;background:none;padding:6px 4px;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg,.nav svg{width:18px;height:18px;flex:none}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left}
.metric span{color:var(--muted);font-size:14px}
.metric strong{display:block;font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.metric small{color:var(--muted)}
.metric.hot{background:var(--accent-soft);border-color:var(--green-line)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{border:0;background:none;padding:10px 0;flex:1;outline:none}
select.filter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs b{margin-left:6px;font-variant-numeric:tabular-nums}
.count{color:var(--muted);font-size:14px;margin:0 0 10px}
.cards{display:flex;flex-direction:column;gap:14px}
.group-title{font-family:var(--display);font-size:19px;margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.ready{border-left-color:var(--accent)}
.card.partial{border-left-color:var(--amber)}
.card.called{border-left-color:var(--blue);background:color-mix(in srgb,var(--blue-soft) 45%,var(--surface))}
.card.inactive{border-left-color:var(--muted);opacity:.78}
.card.reviewed{border-left-color:#7a4fd0}
.card.done{background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface))}
.pair{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.cardmain{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardtop{display:flex;gap:12px;align-items:flex-start}
.num.serial{background:var(--grey-soft);color:var(--ink);border:1px solid var(--line)}
.num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.who{flex:1;min-width:0}
.namerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.namerow h3{margin:0;font-family:var(--display);font-size:19px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--grey-soft);color:var(--muted)}
.tag.tenant{background:var(--blue-soft);color:var(--blue)}
.tag.owner{background:var(--accent-soft);color:var(--accent)}
.tag.broker{background:var(--amber-soft);color:var(--amber)}
.added{font-size:13px;color:var(--muted)}
.place{color:var(--muted);font-size:15px}
.state{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--grey-soft);white-space:nowrap}
.state.ready{background:var(--accent-soft);color:var(--accent)}
.state.partial{background:var(--amber-soft);color:var(--amber)}
.ess{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:baseline}
.ess strong{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ess span{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span,.chips a{font-size:13px;background:var(--grey-soft);border-radius:8px;padding:3px 8px;color:var(--muted);text-decoration:none}
.chips a{color:var(--accent)}
.ask{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:15px;margin:0}
.fgroup{border:1px solid var(--line);border-radius:12px;padding:12px}
.sheetbox{border:1px solid color-mix(in srgb,var(--blue) 40%,var(--line));background:var(--blue-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sheetbox h4{margin:0;display:flex;gap:6px;align-items:center;font-size:14px;color:var(--blue)}.sheetbox svg{width:16px;height:16px}
.sheetrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px}
.fgroup.first{border-color:color-mix(in srgb,var(--amber) 40%,var(--line));background:color-mix(in srgb,var(--amber-soft) 35%,var(--surface))}
.field.wide{grid-column:1/-1}

.fgroup{display:flex;flex-direction:column;gap:12px}.fgroup h4{margin:0}.gsub{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.fgroup.call{border-color:color-mix(in srgb,var(--amber) 40%,var(--line));background:color-mix(in srgb,var(--amber-soft) 35%,var(--surface))}
.ctl{display:flex;flex-direction:column;gap:8px}
.clab{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}.clab svg{width:16px;height:16px}
.clab.miss,.clab.bad{color:var(--red)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip1{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:36px}
.chip1:hover{border-color:var(--accent)}
.chip1.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.ctl.miss .chipset .chip1:not(.on),.ctl.bad .chipset .chip1:not(.on){border-color:color-mix(in srgb,var(--red) 45%,var(--line));background:var(--red-soft)}
.compass{display:grid;grid-template-columns:repeat(3,minmax(0,140px));gap:8px}
.dir{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--grey-soft);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.dir svg{width:16px;height:16px}.dir.mid{background:none;border:0;justify-content:center;color:var(--muted);cursor:default}.dir.mid svg{width:22px;height:22px}
.dir.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pairrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.counter{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:999px;padding:4px;max-width:200px;background:var(--surface)}
.cbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--grey-soft);color:var(--ink);font-size:20px;cursor:pointer;line-height:1}
.cbtn.plus{background:var(--accent);color:var(--accent-ink)}.cbtn:disabled{opacity:.45;cursor:default}
.cval{font-size:17px;font-weight:600;min-width:2ch;text-align:center}
.mrow{display:flex;align-items:center;gap:6px}.rs{font-size:16px;font-weight:600;color:var(--ink)}.field.money input{flex:1}
.field .numin{flex:0 0 auto;width:auto;min-width:2ch}.unit{font-size:16px;color:var(--ink)}.unit.hidden{display:none}
.savepill{position:fixed;top:12px;right:16px;z-index:60;display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.savepill.busy,.savepill.done,.savepill.err{display:inline-flex}.savepill.done{color:var(--accent)}.savepill.err{color:var(--red)}.savepill svg{width:16px;height:16px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status h4{margin:0 0 8px}
.subh{margin:4px 0 -4px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.phead{display:flex;justify-content:space-between;gap:12px;align-items:start}.phead .gsub{margin:0}.pcount{font-size:13px;color:var(--muted);white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,128px);gap:10px}
.ptile{position:relative;width:128px;height:128px;border-radius:14px;overflow:hidden;margin:0;background:var(--grey-soft);animation:pin .25s ease-out;transition:transform .2s}
.ptile:hover{transform:translateY(-1px)}
@keyframes pin{from{opacity:0;transform:scale(.9)}}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile.cover{box-shadow:0 0 0 3px var(--accent)}
.px,.pstar{position:absolute;width:30px;height:30px;border-radius:50%;border:0;background:rgba(20,30,26,.72);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.px svg,.pstar svg{width:16px;height:16px}.px{top:6px;right:6px}.pstar{bottom:6px;left:6px}.pstar:hover{background:var(--accent)}
.pcover{position:absolute;bottom:6px;left:6px;background:rgba(20,30,26,.72);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.ptile.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer}
.ptile.add svg{width:24px;height:24px}.ptile.loading{display:grid;place-items:center}
.plink{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.plink .field{flex:1;min-width:260px;max-width:560px}.pdrive.hidden{display:none}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;place-items:center;padding:20px}
.gatebox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gatebox h1{margin:0}.gatemsg{color:var(--red);font-size:15px}.brandmark.big{font-size:34px}
#whoami{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);padding:0 4px;word-break:break-all}
.team{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:6px}.team li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.nblock{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.nblock.today{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.nhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nlab{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--ink)}.nlab svg,.nsub svg,.ndone svg{width:16px;height:16px}
.nday{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.ndone{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--accent);font-weight:600}
.nblock textarea,.furow input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);font:inherit;font-size:15px;color:var(--ink)}
.nblock textarea{min-height:72px;resize:vertical;field-sizing:content}
.furow{display:grid;grid-template-columns:190px 1fr;gap:12px}
.nblock.err .furow input{border-color:var(--red);background:var(--red-soft)}
.nhist{margin-top:4px}.nsub{display:flex;align-items:center;gap:6px}
@media(max-width:760px){.furow{grid-template-columns:1fr}}
.essrent{display:inline-flex;align-items:center;gap:6px}
.penbtn{border:0;background:var(--accent-soft);color:var(--accent);width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;padding:0}.penbtn svg{width:14px;height:14px}.penbtn:hover{background:var(--accent);color:var(--accent-ink)}
.field.flash{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);transition:box-shadow .3s}
.vk{display:grid;grid-template-columns:minmax(200px,1fr) auto minmax(200px,1fr);gap:16px;align-items:center}
@media(max-width:1100px){.vk{grid-template-columns:1fr}}
.tag.closedtag{display:inline-flex;align-items:center;gap:4px;background:var(--red-soft);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}.tag.closedtag svg{width:13px;height:13px}
.postph{border:1px dashed var(--line);border-radius:12px;padding:10px;background:var(--grey-soft)}.ptile.ref{opacity:.92}
.card.golden{border-color:color-mix(in srgb,#c9a227 45%,var(--line));border-left:6px solid #c9a227;box-shadow:0 2px 14px rgba(201,162,39,.14)}
.card.golden .cardtop{background:linear-gradient(90deg,rgba(201,162,39,.10),transparent 60%);margin:-4px -6px 0;padding:4px 6px;border-radius:10px}
.tag.goldtag{display:inline-flex;align-items:center;gap:4px;background:#fbf3d5;color:#7a5b00;border:1px solid #e6cf7a;font-weight:700}.tag.goldtag svg{width:13px;height:13px;fill:#c9a227;stroke:#a8841a}
@media (prefers-color-scheme:dark){.tag.goldtag{background:#3a2f12;color:#f2d47a;border-color:#6b5520}}
.bhkrow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.bhkrow .ctl{flex:0 1 auto}.field.bhkmore{min-width:170px;max-width:200px;animation:pin .2s ease-out}
.vtfield{max-width:none}
.vk{grid-template-columns:max-content auto minmax(200px,1fr)}
.field .vtrow{flex:0 0 auto;width:auto}
.field input.vthr{width:44px!important;min-width:0!important;flex:0 0 44px!important;max-width:44px;height:36px;padding:0 2px!important;text-align:center}
.field .vtap{flex:0 0 auto}
.field .vtap button{width:auto!important;min-width:0!important;flex:0 0 auto!important;padding:0 8px!important;height:32px;min-height:32px;border-radius:0;box-shadow:none}
.field .vtdel,.field .vtadd{width:auto!important;flex:0 0 auto!important}.vtwrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:6px}
.vtrow{display:inline-flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.vthr{width:3.2ch;text-align:center;font:inherit;font-size:16px;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:8px;padding:6px 2px;background:var(--surface);color:var(--ink)}
.vthr:focus{outline:2px solid var(--accent,#1f6b4f);outline-offset:1px}
.vtap{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtap button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--muted);padding:6px 7px;cursor:pointer;min-height:32px}
.vtap button+button{border-left:1px solid var(--line)}
.vtap button.on{background:var(--ink);color:var(--surface)}
.field input.vthr{border:1.5px solid color-mix(in srgb,var(--ink) 28%,var(--line))!important;border-radius:8px!important;background:var(--surface)!important;font-weight:600}.field input.vthr:focus{border-color:var(--accent)!important}.field input.vthr::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent);font-weight:400}
.vtfield .vtwrap{gap:8px}
.vtto{font-size:13px;color:var(--muted);padding:0 2px}
.vtdel{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;display:inline-flex;border-radius:6px}.vtdel:hover{color:var(--ink);background:var(--line)}.vtdel svg{width:16px;height:16px}
.vtadd{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:40px}.vtadd svg{width:16px;height:16px}
.was{font-size:12px;color:var(--amber)}
.rentpair{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.rentpair{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>
/* ===== Firebase home (rentaldesk.trustkeyper.com). Stands in for the Claude runtime the desk was first built on: same calls, Firebase underneath. ===== */
const ADMINS=['info@trustkeyper.com','amanmaheshwari900@gmail.com'];
const FB={user:null,admin:false};
const fdb=firebase.firestore();
try{fdb.settings({ignoreUndefinedProperties:true,merge:true});}catch(e){}
fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let gateOpen;const gate=new Promise(r=>gateOpen=r);
function gateScreen(html){let g=document.getElementById('gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g);}g.innerHTML=html?`<div class="gatebox">${html}</div>`:'';g.style.display=html?'grid':'none';}
const ACCESS_CONTACT={phone:'+91 80885 16875',email:'info@trustkeyper.com'};
const AUTH={mode:'in',email:''};
function noAccessMsg(email){return `<b>Access has not been given yet</b> for <b>${esc(email)}</b>.<br>Call <a href="tel:${ACCESS_CONTACT.phone.replace(/\s/g,'')}">${ACCESS_CONTACT.phone}</a> or email <a href="mailto:${ACCESS_CONTACT.email}">${ACCESS_CONTACT.email}</a> to get complete access.`;}
function signInScreen(msg,kind){const m=AUTH.mode;
 gateScreen(`<div class="brandmark big">🔑</div><h1>Rental Desk</h1><p class="sub">TrustKeyper · Hyderabad</p>${msg?`<p class="gatemsg ${kind||''}">${msg}</p>`:''}
 <div class="authtabs" role="tablist"><button role="tab" class="${m==='in'?'on':''}" data-amode="in">Log in</button><button role="tab" class="${m==='up'?'on':''}" data-amode="up">Sign up</button></div>
 <form id="aform" class="aform" novalidate>${m==='up'?'<label class="field"><span class="lab">Your name</span><input id="aname" autocomplete="name" placeholder="e.g. Madhav"></label>':''}
 <label class="field"><span class="lab">Email</span><input id="aemail" type="email" autocomplete="email" inputmode="email" placeholder="you@trustkeyper.com" value="${esc(AUTH.email)}"></label>
 <label class="field"><span class="lab">Password</span><input id="apass" type="password" autocomplete="${m==='up'?'new-password':'current-password'}" placeholder="${m==='up'?'At least 8 characters':'Your password'}"></label>
 <button class="btn primary wide" type="submit">${m==='up'?'Create account':'Log in'}</button>${m==='in'?'<button type="button" class="btn link" id="aforgot">Forgot password?</button>':''}</form>
 <div class="ordiv"><span>or</span></div><button class="btn wide" id="gsignin">Continue with Google</button><p class="place">Only team members who have been given access can open the desk.</p>`);
 document.querySelectorAll('[data-amode]').forEach(b=>b.onclick=()=>{AUTH.email=document.getElementById('aemail').value;AUTH.mode=b.dataset.amode;signInScreen('');});
 document.getElementById('gsignin').onclick=()=>{const pv=new firebase.auth.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});firebase.auth().signInWithPopup(pv).catch(e=>{if(e&&e.code!=='auth/popup-closed-by-user')signInScreen('Sign-in did not finish. Try again.','bad');});};
 const fg=document.getElementById('aforgot');if(fg)fg.onclick=async()=>{const e=document.getElementById('aemail').value.trim();AUTH.email=e;if(!/^\S+@\S+\.\S+$/.test(e)){signInScreen('Type your email first, then tap Forgot password.','bad');return;}try{await firebase.auth().sendPasswordResetEmail(e);}catch(x){}signInScreen('If this email has an account, a reset link is on its way. Check your inbox.','good');};
 document.getElementById('aform').onsubmit=async ev=>{ev.preventDefault();const e=document.getElementById('aemail').value.trim().toLowerCase(),pw=document.getElementById('apass').value,nm=(document.getElementById('aname')?.value||'').trim();AUTH.email=e;
  if(!/^\S+@\S+\.\S+$/.test(e)){signInScreen('Type a full email address.','bad');return;}if(pw.length<(m==='up'?8:1)){signInScreen(m==='up'?'Choose a password with at least 8 characters.':'Type your password.','bad');return;}
  const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Please wait…';
  try{if(m==='up'){const r=await firebase.auth().createUserWithEmailAndPassword(e,pw);if(nm)await r.user.updateProfile({displayName:nm});await r.user.sendEmailVerification();}else await firebase.auth().signInWithEmailAndPassword(e,pw);}
  catch(x){const c=x&&x.code||'';signInScreen(c==='auth/email-already-in-use'?'This email already has an account. Log in instead.':c==='auth/weak-password'?'That password is too weak. Use at least 8 characters.':/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)?'Email or password is not right. Try again, or tap Forgot password.':c==='auth/too-many-requests'?'Too many tries. Wait a few minutes and try again.':c==='auth/operation-not-allowed'?'Email sign-in is being switched on. Use Continue with Google for now.':'Could not sign in. Check your internet and try again.','bad');}};}
function verifyScreen(user){gateScreen(`<div class="brandmark big">✉️</div><h1>Check your email</h1><p class="gatemsg">We sent a link to <b>${esc(user.email)}</b>. Open it to confirm your email, then come back and tap the button below.</p><button class="btn primary wide" id="vdone">I've confirmed my email</button><button class="btn wide" id="vsend">Send the link again</button><button class="btn link" id="vout">Use a different email</button>`);
 document.getElementById('vdone').onclick=async()=>{await user.reload();if(firebase.auth().currentUser.emailVerified){await firebase.auth().currentUser.getIdToken(true);location.reload();}else{const b=document.getElementById('vdone');b.textContent='Not confirmed yet. Open the link in your email.';}};
 document.getElementById('vsend').onclick=async()=>{try{await user.sendEmailVerification();document.getElementById('vsend').textContent='Sent. Check your inbox.';}catch(e){document.getElementById('vsend').textContent='Please wait a minute before sending again.';}};
 document.getElementById('vout').onclick=()=>firebase.auth().signOut();}
function onboardScreen(user,prof){const st={name:prof.name||user.displayName||'',phone:prof.phone||'',lang:prof.lang||''};
 const draw=()=>{gateScreen(`<div class="brandmark big">👋</div><h1>Welcome to Rental Desk</h1><p class="sub">Two quick questions before you start.</p>
 <label class="field"><span class="lab">Your name</span><input id="oname" autocomplete="name" value="${esc(st.name)}" placeholder="e.g. Madhav"></label>
 <label class="field"><span class="lab">Your phone number</span><input id="ophone" inputmode="tel" autocomplete="tel" value="${esc(st.phone)}" placeholder="10-digit mobile"></label>
 <p class="lab qlab">Which language do you want the desk in? · भाषा चुनें · భాష ఎంచుకోండి</p><div class="langpick">${LANGS.map(([k,n,en])=>`<button type="button" class="langbtn ${st.lang===k?'on':''}" data-lang="${k}"><b>${n}</b>${k==='en'?'':`<small>${en}</small>`}</button>`).join('')}</div>
 <p class="place">You can change this any time in Profile.</p><button class="btn primary wide" id="ogo">Start</button><p class="gatemsg bad" id="oerr" hidden></p>`);
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{st.name=document.getElementById('oname').value;st.phone=document.getElementById('ophone').value;st.lang=b.dataset.lang;draw();});
  document.getElementById('ogo').onclick=async()=>{st.name=document.getElementById('oname').value.trim();st.phone=document.getElementById('ophone').value.trim();const er=document.getElementById('oerr');
   if(!st.name){er.hidden=false;er.textContent='Type your name.';return;}if(!st.lang){er.hidden=false;er.textContent='Pick a language.';return;}
   const data={name:st.name,phone:st.phone,lang:st.lang,email:String(user.email).toLowerCase(),updatedAt:new Date().toISOString(),...(prof.joinedAt?{}:{joinedAt:new Date().toISOString()})};
   try{await fdb.doc('profiles/'+data.email).set(data,{merge:true});S.profile={...prof,...data};gateScreen('');startDesk(user);}catch(e){er.hidden=false;er.textContent='Could not save. Check your internet and try again.';}};};draw();}
function startDesk(user){const email=String(user.email||'').toLowerCase();FB.user=user;FB.admin=ADMINS.includes(email);gateScreen('');
 const rf=document.querySelector('.railfoot');if(rf&&!document.getElementById('whoami')){const w=document.createElement('div');w.id='whoami';w.innerHTML=`<button class="btn link" data-nav="profile">${icon('circle-user-round')}<span>${esc(S.profile?.name||email)}</span></button>`;rf.after(w);}
 if(typeof render==='function'&&S.loaded)render(true);gateOpen();}
firebase.auth().onAuthStateChanged(async user=>{
 if(!user){FB.user=null;signInScreen('');return;}
 const email=String(user.email||'').toLowerCase();
 if(!user.emailVerified){verifyScreen(user);return;}
 let ok=ADMINS.includes(email);
 if(!ok){try{ok=(await fdb.doc('access/'+email).get()).exists;}catch(e){ok=false;}}
 if(!ok){await firebase.auth().signOut();AUTH.mode='in';signInScreen(noAccessMsg(email),'bad');return;}
 let prof={};try{const d=await fdb.doc('profiles/'+email).get();prof=d.exists?d.data():{};}catch(e){}
 S.profile=prof;
 if(!prof.name||!prof.lang){onboardScreen(user,prof);return;}
 startDesk(user);
});
const fbAssets={async upload(blob){const id='photos/'+Date.now()+'-'+Math.random().toString(36).slice(2,10)+'.'+((blob.type||'image/jpeg').split('/')[1]||'jpg').replace(/[^a-z0-9]/g,'');const ref=firebase.storage().ref(id);await ref.put(blob,{contentType:blob.type||'image/jpeg'});return {id,url:await ref.getDownloadURL(),sizeBytes:blob.size,contentType:blob.type};},async delete(id){if(String(id).startsWith('photos/'))await firebase.storage().ref(id).delete();}};
const DRIVE={token:null,exp:0};
try{const s=JSON.parse(sessionStorage.getItem('driveTok')||'null');if(s&&s.exp>Date.now())Object.assign(DRIVE,s);}catch(e){}
async function driveToken(interactive){
 if(DRIVE.token&&Date.now()<DRIVE.exp-60000)return DRIVE.token;
 if(!interactive)return null;
 const pv=new firebase.auth.GoogleAuthProvider();pv.addScope('https://www.googleapis.com/auth/drive.readonly');pv.setCustomParameters({login_hint:FB.user.email});
 const r=await FB.user.reauthenticateWithPopup(pv);
 DRIVE.token=r.credential&&r.credential.accessToken;DRIVE.exp=Date.now()+55*60000;
 try{sessionStorage.setItem('driveTok',JSON.stringify(DRIVE));}catch(e){}
 return DRIVE.token;
}
function bufB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
async function driveFetch(url,interactive,asJson=true){
 for(let attempt=0;attempt<2;attempt++){
  const t=await driveToken(interactive||attempt>0);
  if(!t){const e=new Error('needs-drive');e.code='needs-drive';throw e;}
  const res=await fetch(url,{headers:{Authorization:'Bearer '+t}});
  if(res.status===401&&attempt===0&&interactive){DRIVE.token=null;continue;}
  if(!res.ok){const e=new Error('drive-'+res.status);e.code='drive-'+res.status;throw e;}
  return asJson?res.json():res.arrayBuffer();
 }
}
const DAPI='https://www.googleapis.com/drive/v3/files';
const fbMcp={async callTool(server,tool,args,opts){
 const interactive=!(opts&&opts.silent);
 if(tool==='download_file_content'){
  const m=await driveFetch(`${DAPI}/${encodeURIComponent(args.fileId)}?fields=id,name,mimeType,size&supportsAllDrives=true`,interactive);
  const native=String(m.mimeType).startsWith('application/vnd.google-apps');
  if(!native&&Number(m.size||0)>12*1024*1024){const e=new Error('too-big');e.code='too-big';throw e;}
  const buf=await driveFetch(native?`${DAPI}/${encodeURIComponent(args.fileId)}/export?mimeType=${encodeURIComponent(args.exportMimeType||'text/plain')}`:`${DAPI}/${encodeURIComponent(args.fileId)}?alt=media&supportsAllDrives=true`,interactive,false);
  return {payload:{id:m.id,title:m.name,mimeType:native?(args.exportMimeType||'text/plain'):m.mimeType,content:bufB64(buf)}};
 }
 if(tool==='search_files'){
  const f=String(args.query||'').match(/parentId = '([\w-]+)'/);if(!f)throw new Error('folder only');
  const q=encodeURIComponent(`'${f[1]}' in parents and trashed = false and mimeType contains 'image/'`);
  const r=await driveFetch(`${DAPI}?q=${q}&fields=files(id,name,mimeType,size)&pageSize=${Math.min(+args.pageSize||20,50)}&supportsAllDrives=true&includeItemsFromAllDrives=true`,interactive);
  return {payload:{files:r.files||[]}};
 }
 throw new Error('unknown tool');
}};
const fbDownloads={async save({filename,data}){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}};
window.claude={use:async name=>{await gate;if(name==='db')return fdb;if(name==='assets')return fbAssets;if(name==='mcp')return fbMcp;if(name==='downloads')return fbDownloads;return null;}};
</script>
<script>
/* ===== Matching and readiness rules, carried over unchanged from the Rental Desk (lib/lead-fields.mjs, lib/core.mjs) ===== */
function isNotApplicable(value){return ['na','notapplicable'].includes(String(value??'').trim().toLowerCase().replace(/[\s./\\_-]/g,''));}
const rawAliases={furnishing:['Furnished state'],food:['Veg/nonveg','VEG/NON-VEG'],occupancy:['Tenant Preferance - Marrital status','TYPE'],workingPreference:['Tenant Preferance - Working preferance'],parking:['Parking','PARKING'],deposit:['Security Deposit'],floor:['Floor of the flat'],totalFloors:['Total Floors in Building'],facing:['Property Facing'],powerBackup:['Power backup- none/partial/full'],lockIn:['Lock in period'],balconies:['Balconies'],bathrooms:['Washrooms'],carpetArea:['Carpet Area '],superBuiltUpArea:['Super Built Up area'],previousBooked:['Previous booked'],customerName:['CUSTOMER NAME'],customerPhone:['CUSTOMER NO'],linkedin:['Linkdein'],moveIn:['FROM DATE']};
function leadDetails(l){const d={...l};for(const [key,aliases] of Object.entries(rawAliases)){if(d[key]===undefined)d[key]=aliases.map(k=>l.raw?.[k]).find(v=>v!==undefined&&v!=='')||'';}return d;}
function listingScope(l){if(l.scope)return isNotApplicable(l.scope)?'':l.scope;const text=String(l.requirement||'').toLowerCase();if(/shared room|double sharing/.test(text))return 'shared';if(/private room|single room|single.occupancy|bedroom available|flatmate|replacement|room only/.test(text))return 'room';return /\d\s*(?:\.5)?\s*b\s*h\s*k|entire|whole/.test(text)?'whole':'';}
const scopeOptions=[['whole','Entire home'],['room','Private room'],['shared','Shared room / bed']];
const BHK=[['1 RK','1 RK'],['1 BHK','1 BHK'],['1.5 BHK','1.5 BHK'],['2 BHK','2 BHK'],['2.5 BHK','2.5 BHK'],['3 BHK','3 BHK'],['3.5 BHK','3.5 BHK'],['4 BHK','4 BHK'],['4+ BHK','4+ BHK']];
const BROKERAGE=[['none','No brokerage'],['15 days','15 days rent'],['20 days','20 days rent'],['1 month','1 month rent'],['other','Other amount']];
const TENANT_TYPES=[['family','Family'],['bachelor-male','Bachelor male'],['bachelor-female','Bachelor female'],['company','Company']];
const commonFields=[['availableFrom','Available from','date'],['name','Name'],['phone','Contact number','tel'],['available','Still available?','select'],['society','Society / preferred areas'],['locality','Area / locality'],['scope','Home or room','select',scopeOptions],['requirement','Flat type / BHK','select',BHK],['amountText','Monthly rent / budget'],['furnishing','Furnishing','select',[['fully','Fully furnished'],['semi','Semi-furnished'],['unfurnished','Unfurnished'],['any','Any furnishing']]],['food','Food preference','select'],['pets','Pets','select']];
const ownerFirstCall=[['brokerage','Owner brokerage','select',BROKERAGE],['brokerageAmount','Owner brokerage ₹'],['deposit','Security deposit ₹'],['whoCanRent','Who can rent','multi',[['anyone','Anyone'],...TENANT_TYPES]]];
const tenantFirstCall=[['brokerage','Tenant brokerage','select',BROKERAGE],['brokerageAmount','Tenant brokerage ₹'],['tenantType','Tenant type','select',TENANT_TYPES],['people','People who will live','text'],['moveIn','Move-in date','date']];
const ownerFields=[['visitTimes','Visit times allowed'],['keysWho','Keys are','select',[['owner','With owner'],['security','With security'],['lockbox','In a lockbox'],['us','With TrustKeyper']]],['keys','How to collect keys'],['unit','Flat number'],['tower','Tower number'],['area','Built-up area (sq ft)'],['carpetArea','Carpet area (sq ft)'],['superBuiltUpArea','Super built-up area (sq ft)'],['carParking','Car parking'],['bikeParking','Bike parking'],['parking','Parking (notes)'],['lockIn','Minimum stay (months)'],['notice','Notice period (months)'],['photos','Photos link','url'],['floor','Floor of flat'],['totalFloors','Total floors in building'],['facing','Property facing','select',[['East','East'],['West','West'],['North','North'],['South','South'],['North-East','North-East'],['North-West','North-West'],['South-East','South-East'],['South-West','South-West']]],['powerBackup','Power backup','select',[['none','None'],['partial','Partial'],['full','Full']]],['lockIn','Lock-in period'],['balconies','Balconies'],['bathrooms','Washrooms'],['previousBooked','Previously booked / vacant'],['customerName','Existing tenant name'],['customerPhone','Existing tenant number','tel']];
const tenantFields=[['workingPreference','Company / work'],['email','Email'],['occupancy','Household notes'],['linkedin','LinkedIn profile','url']];
function preferenceOptions(kind,key){if(key==='food')return kind==='owner'?[['any','Veg and non-veg allowed'],['veg','Vegetarian only']]:[['veg','Vegetarian'],['nonveg','Non-vegetarian'],['any','No food preference']];if(key==='pets')return kind==='owner'?[['yes','Pets allowed'],['no','Pets not allowed']]:[['yes','Has pets'],['no','No pets']];return [];}
function foodValue(value){const s=String(value||'').trim().toLowerCase();if(/^(any|both|veg and non-veg allowed|no food preference)$/.test(s))return 'any';if(/non.?veg/.test(s))return 'nonveg';if(/veg/.test(s))return 'veg';return '';}
function petValue(value){const s=String(value||'').trim().toLowerCase();if(/^(no|none|no pets|pets not allowed)$/.test(s))return 'no';if(/^(yes|has pets|pets allowed)$/.test(s))return 'yes';return '';}
function money(input){const text=String(input??'').trim().toLowerCase();if(!text||/^(na|n\/a|any|negotiable|-)$/i.test(text))return null;const m=text.replace(/₹|rs\.?|inr/gi,'').trim().match(/^(\d[\d,]*(?:\.\d+)?)\s*(lakh|lac|lacs|lakhs|l|k)?/);if(!m)return null;let n=Number(m[1].replaceAll(',',''));if(m[2])n*=m[2].startsWith('l')?100000:1000;else if(n>0&&n<1000)n*=1000;return n>0&&n<5000000?n:null;}
function budgetCeiling(input){const text=String(input??'').trim().replace(/^(?:up to|max(?:imum)?[: ]*|under|budget[: ]*)\s*/i,'');const range=text.match(/^(.+?)\s*(?:[-–—]|\bto\b)\s*(.+)$/i);if(!range)return money(text);const low=money(range[1]),high=money(range[2]);return low!==null&&high!==null&&low<=high?high:null;}
function flexibleArea(value){return /^(?:any(?: area| location|where)?|flexible|no preference|no area preference)$/i.test(String(value??'').trim());}
function maintenanceMoney(input){const s=String(input??'').trim().toLowerCase().replace(/₹|rs\.?|inr/gi,'').trim();const m=s.match(/^(\d[\d,]*(?:\.\d+)?)\s*(lakh|lac|lacs|lakhs|l|k)?/);if(!m)return null;let n=Number(m[1].replaceAll(',',''));if(m[2])n*=m[2].startsWith('l')?100000:1000;return n>=0&&n<5000000?n:null;}
function phone(value){const raw=String(value??'').replace(/\.0$/,'');const ind=x=>{let s=x.replace(/\D/g,'');if(s.length===12&&s.startsWith('91'))s=s.slice(2);if(s.length===11&&s.startsWith('0'))s=s.slice(1);return /^[6-9]\d{9}$/.test(s)?s:'';};let r=ind(raw);if(r)return r;const parts=raw.match(/\+?\s*\d[\d\s-]{7,16}\d/g)||[];for(const p of parts){r=ind(p);if(r)return r;}for(const p of parts){const dg=p.replace(/\D/g,'');if(/^\s*\+/.test(p)&&dg.length>=10&&dg.length<=13&&!dg.startsWith('91'))return '+'+dg;}return '';}
function date(value){if(!value)return '';const s=String(value);if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:'';}
const addedDateFormat=new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',year:'numeric'});
const addedTimeFormat=new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true});
function leadAddedStamp(lead){const exact=String(lead.addedAt||'');if(/^\d{4}-\d{2}-\d{2}T/.test(exact)&&Number.isFinite(Date.parse(exact))){const moment=new Date(exact);return 'Added '+addedDateFormat.format(moment)+', '+addedTimeFormat.format(moment)+' IST';}const d=date(lead.added);const noon=new Date(d+'T12:00:00Z');if(!Number.isFinite(noon.getTime())||noon.toISOString().slice(0,10)!==d)return 'Date added unavailable';return 'Added '+addedDateFormat.format(noon);}

function inRentalScope(l){const scope=listingScope(l),amount=l.kind==='tenant'?budgetCeiling(l.amountText):money(l.amountText);return scope==='room'||scope==='shared'||amount===null||amount>50000;}

function missingLeadFields(l){const p=prepare(l),out=[];const add=(key,label)=>{if(key==='phone'||!isNotApplicable(leadDetails(l)[key]))out.push({key,label});};if(!p.phone)add('phone','Contact number');if(!p.societyKey)add('society','Society / preferred areas');if(!p.scope)add('scope','Entire home or room');if(!p.beds&&p.scope!=='room'&&p.scope!=='shared')add('requirement','Flat type / BHK');if(!p.amount)add('amountText',l.kind==='owner'?'Monthly rent':'Monthly budget');if(!p.furnishing)add('furnishing','Furnishing');if(!p.food)add('food',l.kind==='owner'?'Food allowed':'Food preference');if(!p.pets)add('pets',l.kind==='owner'?'Pets allowed':'Has pets?');const dateKey=l.kind==='owner'?'availableFrom':'moveIn';if(!date(p[dateKey]))add(dateKey,l.kind==='owner'?'Available from':'Move-in date');return out;}

BHK works for them`);rank+=1;}else if(t.scope!=='room'&&t.scope!=='shared')checks.push('Confirm bedrooms');if(t.societyKey&&p.societyKey){reasons.push('Area fits');rank+=4;}else if(!flexibleArea(t.society))checks.push('Confirm preferred area');if(t.furnishing&&p.furnishing){reasons.push('Furnishing fits');rank+=2;}else if(t.furnishing&&!p.furnishing)checks.push('Confirm furnishing');if(!freshness(p,now))checks.push('Confirm property is still available');if(!freshness(t,now))checks.push('Confirm tenant is still searching');if(!date(t.moveIn)||!date(p.availableFrom))checks.push('Confirm move-in and availability dates');else if(date(p.availableFrom)>date(t.moveIn))return null;const ready=!checks.length;return {property:p0,tenant:t0,rank:rank+(ready?10:0),reasons,checks,ready};}

async function writeLead(lead,{discussion,called}={}){

 if(discussion!==undefined||called){
  const day=localDay(now),hist=[...(lead.discussionHistory||[])];
  const ex=hist.find(e=>e.day===day);
  const prev=S.byId.get(lead.id);
  const scheduled=date(prev?.followup);
  const entry={day,discussion:discussion??ex?.discussion??'',agenda:ex?.agenda||(scheduled&&scheduled<=day?String(prev?.followupNote||''):''),followup:date(next.followup),followupNote:next.followupNote||'',called:!!(called||ex?.called)};
  next.discussionHistory=[...hist.filter(e=>e.day!==day),entry];
  if(called)next.callHistory=[...(lead.callHistory||[]).slice(-49),{at:now.toISOString(),outcome:'Called'}];
  const pid=S.about?.[lead.id];const txt=String(entry.discussion||'').trim();

 }
  else{const day=localDay(now),hist=lead.discussionHistory||[];const ex=hist.find(e=>e.day===day);if(ex&&(ex.followup!==date(next.followup)||ex.followupNote!==(next.followupNote||''))){next.discussionHistory=hist.map(e=>e.day===day?{...e,followup:date(next.followup),followupNote:next.followupNote||''}:e);}}
 try{await S.db.doc('leads/'+docKey(lead.id)).set(clean(next));delete S.drafts[lead.id];S.byId.set(next.id,next);S.leads=S.leads.map(x=>x.id===next.id?next:x);return true;}
 catch(e){toast(e&&e.code==='quota_exceeded'?'The desk database is full. Tell Aman.':'Could not save. Your changes are still on this card.');if(e&&e.code==='invalid_argument'&&!S.leads.length)S.canWrite=false;return false;}
}

}
function refreshEss(id){const el=document.querySelector(`[data-ess="${CSS.escape(id)}"]`);const l=S.byId.get(id);if(!el||!l)return;const t=document.createElement('div');t.innerHTML=essHtml(l);el.replaceWith(t.firstElementChild);fixIcons();}
function card(l,{opts,num,queue,pairMode,serial}={}){
 const d=draftOf(l),p=prepare(l),[st,stLabel]=stateOf(l),tags=sourceTags(l);
 const blockers=matchingBlockers(l),ch=changedFlags(l),changes=ch.details||ch.discussion||ch.followup||ch.review;
 const owner=l.kind==='owner',role=leadRole(l);
 const id=esc(l.id);
 const sendAvail=l.status!=='closed'&&leadReadiness(l)==='filled';
 const callErr=S.attempt['call:'+l.id]?new Set(callCompletionErrors(merged(l))):new Set();
 const hist=discussionEntries(l);
 const top=`<div class="cardtop">${num?`<span class="num" aria-label="Match ${num}">${num}</span>`:serial?`<span class="num serial" aria-label="Record ${serial}">${serial}</span>`:''}
  <div class="who"><div class="namerow"><h3>${esc(owner?(l.name||'Owner name not stated'):(l.name||'Tenant name not stated'))}</h3><span class="tag ${isBroker(l)?'broker':owner?'owner':'tenant'}">${role}</span>${isGolden(l)?`<span class="tag goldtag">${icon('star')}Golden lead</span>`:''}${l.status==='closed'?`<span class="tag closedtag">${icon('archive')}${esc(leadClosureLabel(l))}</span>`:''}</div>
  <div class="place">${esc(l.society||(owner?'Society not stated':'Preferred area not stated'))}${l.unit?' · Flat '+esc(l.unit):''}</div>
  <div class="added">${esc(leadAddedStamp(l))}</div></div></div>`;
 const isSent=st==='ready';const stateHtml=`<div class="stcol">${isSent?`<button type="button" class="state ready chipbtn" data-act="gomatch" data-id="${id}" title="Open in Matches">${icon('circle-check')}${esc(stLabel)}${icon('chevron-right')}</button>`:`<span class="state ${st}">${st==='filled'?icon('circle-check'):st==='paused'?icon('pause'):''}${stLabel}</span>`}${sendAvail?`<button class="btn primary" data-act="send" data-id="${id}">${icon('send')}Send for matching</button>`:isSent?`<button class="btn" data-act="refreshmatch" data-id="${id}">${icon('refresh-cw')}Refresh matches</button>`:''}</div>`;
 const ph=owner?(l.photoList||[]):[];
 const thumb=ph.length?`<button type="button" class="cthumb" data-act="tophotos" data-id="${id}" aria-label="See all ${ph.length} photo${ph.length>1?'s':''}"><img src="${esc(ph[0].url)}" alt="" loading="lazy">${ph.length>1?`<span class="cmore">${icon('images')}+${ph.length-1}</span>`:''}</button>`:'';
 const ess=essHtml(l);
 const chips=`<div class="chips"><span>${esc(tags.source)}</span>${tags.posted?`<span>Posted ${shownDate(tags.posted)}</span>`:''}${tags.url?`<a href="${esc(tags.url)}" target="_blank" rel="noopener">Original post ↗</a>`:''}${/^https?:\/\//i.test(l.photos||'')?`<a href="${esc(l.photos)}" target="_blank" rel="noopener">Photos ↗</a>`:''}${l.dataWarnings?.length?`<span title="${esc(l.dataWarnings.join(' · '))}">Source checks: ${l.dataWarnings.length}</span>`:''}</div>`;
 const ask=p.phone&&blockers.length?`<p class="ask"><b>Ask on the call:</b> ${blockers.map(b=>b.label.toLowerCase()).join(', ')}.</p>`:(!owner&&p.phone&&!p.societyKey&&!flexibleArea(l.society)?`<p class="ask"><b>Ask on the call:</b> which areas work?</p>`:'');
 const saveBtn=S.attempt['err:'+l.id]?`<p class="msg-err" role="alert">${esc(S.attempt['err:'+l.id])}</p>`:'';
 const notes=`<section class="notes"><h4>Log today's call</h4><p class="place stepintro">Write what was said and set the next follow-up. It saves to History by itself.</p>
  <div class="nblock today"><div class="nhead"><span class="nlab"><b class="sn">1</b>${icon('message-square-text')}What was discussed today</span><span class="nday">${shownDate(today())}</span></div><label class="sr" for="dn-${id}">Notes from today's call</label><div class="tawrap"><textarea id="dn-${id}" data-note="discussion" data-lead="${id}" maxlength="4000" rows="3" placeholder="e.g. Wants 2 BHK near Gachibowli, can visit Saturday after 11 am">${esc(d.discussion)}</textarea><button type="button" class="tamic" data-act="dictate" data-id="${id}" title="Speak instead of typing">${icon('mic')}Speak</button><button type="button" class="tasend" data-act="discsave" data-id="${id}" title="Add to today's call (Ctrl + Enter)" aria-label="Add to today's call" ${l.status==='closed'?'disabled':''}>${icon('corner-down-left')}Add</button></div>${aboutPick(l)}<div class="callalt"><span class="place">Couldn't talk properly?</span><button class="btn" data-act="noanswer" data-id="${id}" ${l.status==='closed'?'disabled':''}>${icon('phone-missed')}No answer${noAnswers(l)?' ('+noAnswers(l)+')':''}</button><button class="btn" data-act="callback" data-id="${id}" ${l.status==='closed'?'disabled':''}>${icon('clock')}Busy, call later</button><button class="btn warn" data-act="notint" data-id="${id}" ${l.status==='closed'?'disabled':''}>${icon('thumbs-down')}Not interested</button></div></div>
  <div class="nblock fu2 ${callErr.has('followup')||callErr.has('followupNote')?'err':''}"><div class="nhead"><span class="nlab"><b class="sn">2</b>${icon('calendar-clock')}Next follow-up</span><span class="place">When to call again, and why</span></div><div class="furow"><label class="sr" for="fd-${id}">Follow-up date</label><input id="fd-${id}" type="date" data-note="followup" data-lead="${id}" value="${esc(d.followup)}"><input id="fn-${id}" aria-label="What to discuss on the follow-up" data-note="followupNote" data-lead="${id}" value="${esc(d.followupNote)}" placeholder="e.g. Confirm Saturday visit time"></div></div>
  ${!sendAvail&&leadReadiness(l)==='ready'&&l.status!=='closed'?`<div class="row sendrow"><button class="btn" data-act="refreshmatch" data-id="${id}">${icon('refresh-cw')}Refresh matches</button><span class="place">${esc(matchChip(l))}</span></div>`:''}${sendAvail?`<div class="row sendrow"><button class="btn primary" data-act="send" data-id="${id}">${icon('send')}Send for matching</button></div>`:''}
  
  ${callErr.size?`<p class="msg-err" role="alert">To save this call, add ${(()=>{const m=[...(callErr.has('phone')?['a valid 10-digit phone number']:[]),...(callErr.has('followup')?['the next follow-up date']:[]),...(callErr.has('followupNote')?['what to discuss on the follow-up']:[])];return m.length>1?m.slice(0,-1).join(', ')+' and '+m[m.length-1]:m[0];})()}.</p>`:''}
  <div class="nhwrap"><h4 class="nsub">${icon("history")}History <span class="ro">${icon("lock")}Read-only. Every call you log above lands here.</span></h4><div class="nhbox"><div class="nhist">${calledToday(l)||l.status==='closed'?'':`<div class="hpreview" id="hp-${id}" ${d.discussion||d.followup||d.followupNote?'':'hidden'}><div class="hdate"><b>Today</b><small>not saved yet</small></div><div class="hbody"><p class="hdisc" data-hp="disc">${esc(d.discussion)||'<span class="none">Nothing written yet</span>'}</p><p class="hnext" data-hp="next">${icon('calendar-clock')}<span><b>Next follow-up${d.followup?' · '+shownDate(d.followup):''}</b>${d.followupNote?' — '+esc(d.followupNote):''}</span></p><p class="hpnote">${icon('arrow-up')}Saves to History by itself once step 1 and step 2 are filled.</p></div></div>`}${hist.length?`<ol class="htl">${hist.map(e=>{const d=new Date(e.day+'T12:00:00');const outs=e.outcomes||[];return `<li class="hentry"><div class="hdate"><b>${d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</b><small>${d.toLocaleDateString('en-IN',{weekday:'short'})} · ${d.getFullYear()}</small></div><div class="hbody">${outs.length?`<div class="houts">${outs.map(o=>`<span class="hout ${/no answer/i.test(o)?'miss':/busy|later/i.test(o)?'later':/not interested|checked back/i.test(o)?'grey':'ok'}">${icon(/no answer/i.test(o)?'phone-missed':/busy|later/i.test(o)?'clock':'phone-call')}${esc(o)}</span>`).join('')}</div>`:''}${e.discussion?`<p class="hdisc">${esc(e.discussion)}</p>`:`<p class="hdisc none">No notes written for this call.</p>`}${e.agenda?`<p class="hplan"><span>Planned for this call</span>${esc(e.agenda)}</p>`:''}${e.followup||e.followupNote?`<p class="hnext">${icon('calendar-clock')}<span><b>Next follow-up${e.followup?' · '+shownDate(e.followup):''}</b>${e.followupNote?' — '+esc(e.followupNote):''}</span></p>`:''}</div></li>`;}).join('')}</ol>`:'<p class="place">No calls recorded yet.</p>'}${l.notes?`<p class="place"><b>Earlier notes:</b> ${esc(l.notes)}</p>`:''}</div></div></div>
  </section>`;
 const status=`<section class="status"><h4>Team notes and status</h4><label for="rv-${id}" class="place">Notes about this lead that are not from a call, e.g. "Owner prefers WhatsApp". These are not added to History.</label><textarea id="rv-${id}" data-note="review" data-lead="${id}" rows="2" maxlength="1000">${esc(d.review)}</textarea>
  <div class="row">
  ${l.status==='closed'?`<button class="btn" data-act="reactivate" data-id="${id}">${owner?'Available again':'Looking again'}</button><button class="btn" data-act="survey" data-id="${id}">Record new update</button>`:`<button class="btn" data-act="gone" data-id="${id}">${owner?'Not available':'No longer looking'}</button>`}
  <button class="btn" data-act="broker" data-id="${id}">${isBroker(l)?'Remove broker tag':'Mark as broker'}</button>
  <button class="btn danger" data-act="delete" data-id="${id}">${icon('trash-2')}Delete</button></div></section>`;
 const sc=(l.sheetChanges||[]);const sheetBox=sc.length?`<section class="sheetbox"><h4>${icon('sheet')}Updated in the Google Sheet</h4>${sc.map((c,i)=>`<div class="sheetrow"><span><b>${esc(c.label)}:</b> <s>${esc(c.from||'blank')}</s> → <b>${esc(c.to)}</b></span><span class="row"><button class="btn primary" data-act="sheetaccept" data-id="${id}" data-i="${i}">Accept</button><button class="btn" data-act="sheetreject" data-id="${id}" data-i="${i}">Reject</button></span></div>`).join('')}</section>`:'';
 const cs=l.closeSurvey||{};const closedBox=l.status==='closed'?`<section class="sheetbox closedbox"><h4>${icon('archive')}${esc(leadClosureLabel(l))}${l.closedAt?' · '+shownDate(l.closedAt):''}</h4>${cs.from||cs.place||cs.rent||cs.who||cs.notes?`<p class="place">${[cs.from?(owner?'Rented from ':'Moved in ')+shownDate(cs.from):'',cs.place?'At '+esc(cs.place):'',cs.rent?'Rent ₹'+esc(cs.rent):'',cs.who?esc(cs.who):'',cs.notes?esc(cs.notes):''].filter(Boolean).join(' · ')}</p>`:''}${l.checkBackOn?`<p class="place"><b>Check back on ${shownDate(l.checkBackOn)}:</b> ${esc(l.checkBackNote||'')}</p>`:''}<div class="row"><button class="btn" data-act="survey" data-id="${id}">Record new update</button>${date(l.checkBackOn)&&date(l.checkBackOn)<=today()?`<button class="btn" data-act="checkedback" data-id="${id}">Called, no change</button>`:''}<button class="btn primary" data-act="reactivate" data-id="${id}">${owner?'Available again':'Looking again'}</button></div></section>`:'';
 const head=`<div class="hdwrap"><div class="hdleft">${top}${ess}${chips}</div>${thumb?`<div class="hdmid">${thumb}</div>`:'<div class="hdspace"></div>'}<div class="hdright">${stateHtml}</div></div>`;
 const body=`<div class="cardmain">${head}${closedBox}${sheetBox}${ask}${optCols(fieldsBlock(l,d))}${saveBtn}${notes}${status}</div>`;
 const cls=`card ${st} ${num&&l.matchCompleted?'done':''} ${isGolden(l)?'golden':''}`;
 if(opts&&(num||pairMode)&&l.kind==='tenant'&&l.status!=='closed'){
  return `<article class="${cls} pair" data-card="${id}">${body}${dealPanel(l,opts)}${matchCalls(l,opts)}</article>`;
 }
 return `<article class="${cls}" data-card="${id}">${body}</article>`;
}

/* ===== Match workspace: per-tenant shortlist, stages, call log, deal done ===== */
const MSTAGES=[['suggested','Suggested'],['shared','Shared with tenant'],['interested','Tenant interested'],['visit','Visit planned'],['visited','Visited'],['negotiating','Negotiating'],['chosen','Tenant chose this']];
const MREMOVE=['Tenant not interested','Too expensive','Wrong area','Wrong size or type','Owner said no to this tenant','Not available any more','Other'];
const stageIx=s=>Math.max(0,MSTAGES.findIndex(x=>x[0]===s));
const stageLabel=s=>(MSTAGES.find(x=>x[0]===s)||MSTAGES[0])[1];
const homeName=o=>o?[o.society||'Society not stated',o.unit?'Flat '+o.unit:''].filter(Boolean).join(' · '):'Home';
const mstamp=at=>{const d=new Date(at);return isNaN(d)?'':d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});};
async function mWrite(id,patchFn,logText,extra){const base=S.byId.get(id);if(!base)return false;const dr=S.drafts[id];const patch=patchFn(base);const log=logText?[...(base.matchLog||[]).slice(-199),{at:new Date().toISOString(),auto:true,text:logText,...(extra||{})}]:base.matchLog;const ok=await writeLead({...base,...patch,...(log?{matchLog:log}:{})});if(dr)S.drafts[id]=dr;return ok;}
function homeRows(t,opts){const sl=t.shortlist||{},hid=t.hiddenHomes||{},rows=[],seen=new Set();
 for(const m of opts||[]){const o=m.property;if(hid[o.id]||seen.has(o.id))continue;seen.add(o.id);rows.push({o,m,manual:sl[o.id]?.added==='manual',st:sl[o.id]||{}});}
 for(const [pid,s] of Object.entries(sl)){if(seen.has(pid)||hid[pid])continue;const o=S.byId.get(pid);if(!o||o.deletedAt)continue;seen.add(pid);const m=(opts||[]).find(x=>x.property.id===pid)||null;rows.push({o,m,manual:s.added==='manual',st:s});}
 rows.forEach((r,i)=>r.i=i);rows.sort((a,b)=>(stageIx(b.st.stage)-stageIx(a.st.stage))||((b.manual?1:0)-(a.manual?1:0))||(a.i-b.i));return rows;}
function homeRow(t,r){const o=r.o,tid=esc(t.id),pid=esc(o.id),st=r.st.stage||'suggested',gone=o.status==='closed';const last=[...(t.matchLog||[])].reverse().find(e=>e.pid===o.id&&!e.auto)||[...(t.matchLog||[])].reverse().find(e=>e.pid===o.id);
 return `<div class="hm st-${st} ${gone?'gone':''}"><div class="hmtop"><span class="t">${esc(homeName(o))}</span><span class="tag ${r.manual?'mine':'auto'}">${r.manual?'Added by you':'Suggested'}</span>${gone?`<span class="tag closedtag">${icon('archive')}${esc(leadClosureLabel(o))}</span>`:''}</div>
 <span class="p">${esc(o.requirement||'Home type to confirm')} · ${esc(propertyRentLabel(o))}${o.locality?' · '+esc(o.locality):''}</span><span>${esc(o.name||'Owner')} · <b>${esc(prepare(o).phone||'No phone')}</b>${isBroker(o)?' · Broker':''}</span>
 ${r.m&&r.m.reasons.length?`<span class="reasons">${esc(r.m.reasons.join(' · '))}</span>`:''}${r.m&&r.m.checks.length?`<span class="hmcheck">${icon('alert-circle')}Check: ${esc(r.m.checks.join(' · '))}</span>`:(!r.m&&!gone?`<span class="hmcheck">${icon('alert-circle')}Not an automatic match. Check it fits the tenant.</span>`:'')}
 <div class="hmrow"><label class="sr" for="ms-${tid}-${pid}">Stage</label><select id="ms-${tid}-${pid}" class="mstage" data-mstage="1" data-t="${tid}" data-p="${pid}" ${gone?'disabled':''}>${MSTAGES.map(([v,x])=>`<option value="${v}" ${v===st?'selected':''}>${x}</option>`).join('')}</select>${st==='visit'||st==='visited'?`<label class="mvis">${icon('calendar')}<input type="datetime-local" data-mvisit="1" data-t="${tid}" data-p="${pid}" value="${esc(r.st.visitAt||'')}" aria-label="Visit date and time"></label>`:''}</div>
 ${visitLine(t,o)}${last?`<p class="hmlast"><time>${mstamp(last.at)}</time> ${esc(last.text)}</p>`:''}
 <div class="row hmact">${st==='chosen'&&!gone?`<button class="btn primary" data-act="mdeal" data-id="${tid}" data-pid="${pid}">${icon('badge-check')}Deal done</button>`:''}${gone?'':`<button class="btn wa" data-act="mshare" data-id="${tid}" data-pid="${pid}">${icon('send')}Share on WhatsApp</button>`}<button class="btn link" data-act="pitch" data-id="${tid}" data-pid="${pid}">${icon('message-circle')}Pitch</button><button class="btn link" data-act="mnote" data-id="${tid}" data-pid="${pid}">${icon('notebook-pen')}Add note</button><button class="btn link warn" data-act="mremove" data-id="${tid}" data-pid="${pid}">${icon('x')}Remove</button></div></div>`;}
function dealPanel(t,opts){const rows=homeRows(t,opts),all=S.showAll?.[t.id],keep=rows.filter(r=>r.manual||stageIx(r.st.stage)>0),rest=rows.filter(r=>!(r.manual||stageIx(r.st.stage)>0));const vis=[...keep,...(all?rest:rest.slice(0,Math.max(0,4-keep.length)))];const more=rows.length-vis.length;const hid=Object.entries(t.hiddenHomes||{});const tid=esc(t.id);
 return `<aside class="opts deal"><div class="dhead"><h4>Homes for ${esc(t.name||'this tenant')} <b class="cnt">${rows.length}</b></h4><button class="btn" data-act="madd" data-id="${tid}">${icon('plus')}Add a home</button></div>
 ${!rows.length?'<p class="place">No home yet. Add one from your properties, or wait for new properties.</p>':''}${vis.map(r=>homeRow(t,r)).join('')}
 ${more>0?`<button class="btn link" data-act="mmore" data-id="${tid}">Show ${more} more suggestion${more>1?'s':''}</button>`:all&&rest.length>4?`<button class="btn link" data-act="mmore" data-id="${tid}">Show fewer</button>`:''}
 ${hid.length?`<details class="hidlist"><summary>Removed homes (${hid.length})</summary>${hid.map(([pid,h])=>{const o=S.byId.get(pid);return `<div class="hidrow"><span><b>${esc(homeName(o))}</b><small>${esc(h.reason||'')}${h.at?' · '+mstamp(h.at):''}</small></span><button class="btn link" data-act="mrestore" data-id="${tid}" data-pid="${esc(pid)}">Bring back</button></div>`;}).join('')}</details>`:''}</aside>`;}
function matchCalls(t,opts){const tid=esc(t.id);const log=[...(t.matchLog||[])].reverse();if(!log.length)return '';
 return `<section class="mcall"><h4>${icon('house')}Notes by home <span class="ro">${icon('lock')}Log calls in "Log today's call" above and pick the home under "About".</span></h4>
 <ol class="mlog">${log.slice(0,S.mlogAll?.[t.id]?200:6).map(e=>{const o=e.pid?S.byId.get(e.pid):null;return `<li class="${e.auto?'auto':''}"><time>${mstamp(e.at)}</time><div>${o?`<span class="tag home">${esc(homeName(o))}</span>`:''}${e.outcome&&e.outcome!=='spoke'?`<span class="tag">${e.outcome==='noanswer'?'No answer':'Busy'}</span>`:''}<span>${esc(e.text||'')}</span>${e.followup?`<small>Next: ${shownDate(e.followup)}${e.followupNote?' · '+esc(e.followupNote):''}</small>`:''}</div></li>`;}).join('')}</ol>${log.length>6?`<button class="btn link" data-act="mlogall" data-id="${tid}">${S.mlogAll?.[t.id]?'Show recent only':'Show all '+log.length}</button>`:''}</section>`;}
function aboutPick(l){if(l.kind!=='tenant'||l.status==='closed')return '';const opts=computed().pairs.get(l.id)||[];const rows=homeRows(l,opts);if(!rows.length)return '';const cur=S.about?.[l.id]||'';const id=esc(l.id);
 return `<label class="aboutpick"><span class="place">${icon('house')}About</span><select id="ab-${id}" data-about="${id}"><option value="">All homes / general</option>${rows.map(r=>`<option value="${esc(r.o.id)}" ${cur===r.o.id?'selected':''}>${esc(homeName(r.o))}</option>`).join('')}</select></label>`;}
function addHomeHtml(){const m=S.modal,t=S.byId.get(m.id);if(!t)return '';return `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="Add a home" style="max-width:720px"><div class="mhead"><h2>Add a home for ${esc(t.name||'this tenant')}</h2><button class="iconx" data-act="closemodal" aria-label="Close">${icon('x')}</button></div><input id="mhq" class="filter" placeholder="Search society, area, owner name, phone or BHK" autocomplete="off" value="${esc(m.q||'')}"><div id="mhres" class="mhres">${addHomeResults()}</div></section></div>`;}
function addHomeResults(){const m=S.modal,t=S.byId.get(m.id);if(!t)return '';const have=new Set(Object.keys(t.shortlist||{}));const q=String(m.q||'').toLowerCase().trim();const auto=new Map((computed().pairs.get(t.id)||[]).map(x=>[x.property.id,x]));
 let list=S.leads.filter(o=>o.kind==='owner'&&!o.deletedAt&&!o.archivedAt&&o.status!=='closed');
 if(q)list=list.filter(o=>[o.society,o.locality,o.name,o.phone,o.requirement,o.unit,o.amountText].join(' ').toLowerCase().includes(q));
 list.sort((a,b)=>((auto.has(b.id)?1:0)-(auto.has(a.id)?1:0))||newest(a,b));

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function stableId(r){const base=(r.sourceUrl||'')+'|'+(r.offerRef||'');if(base.length>1)return (await sha(base)).slice(0,32);return crypto.randomUUID();}
async function stageImport(file){
 try{
  const j=JSON.parse(await file.text());const rows=Array.isArray(j)?j:j.leads;if(!Array.isArray(rows))throw 0;
  const ids=new Set(S.leads.map(l=>l.id)),keys=new Set(S.leads.filter(l=>!l.deletedAt).map(duplicateKey).filter(Boolean));
  const fresh=[];let skipped=0,bad=0;const nowIso=new Date().toISOString();
  for(const r of rows){
   if(!r||typeof r!=='object'||!['tenant','owner'].includes(r.kind)){bad++;continue;}
   const id=r.id||await stableId(r);const k=duplicateKey(r);
   if(ids.has(id)||(k&&keys.has(k))){skipped++;continue;}
   ids.add(id);if(k)keys.add(k);
   fresh.push({status:'unverified',added:localDay(),...('added' in r||'addedAt' in r?{}:{addedAt:nowIso}),source:'Manual entry',...r,id,phone:r.phone?String(r.phone):'',discoveryOnly:r.discoveryOnly??!phone(r.phone)});
  }
  S.import={name:file.name,fresh,skipped,bad,done:0};
 }catch{toast('That file is not a lead list. Choose the JSON file the agent produced.');}
 render(true);
}

function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++;}else q=!q;}else if(!q&&c===','){row.push(cell);cell='';}else if(!q&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);rows.push(row);return rows;}
const sv=v=>String(v??'').replace(/\s+/g,' ').trim();

function readTab(rows,map,kind){
 if(!rows)return [];let hi=rows.findIndex(r=>r.filter(c=>sv(c)).length>=4);if(hi<0)return [];
 const head=rows[hi].map(h=>sv(h).toLowerCase());const seen={},cols=[];
 head.forEach((h,i)=>{if(!h)return;const key=seen[h]?h+'#2':h;seen[h]=(seen[h]||0)+1;if(map[key])cols.push([i,map[key]]);});
 const out=[];
 for(const r of rows.slice(hi+1)){if(r.slice(1,12).filter(c=>sv(c)).length<2)continue;const rec={kind,_serial:sv(r[0]).replace(/\D/g,'')};for(const [i,f] of cols){const v=sv(r[i]);if(f==='serial')continue;if(f==='phone'&&rec.phone&&!v)continue;rec[f]=v;}out.push(rec);}
 return out;
}

 return v;
}

function psHi(name,q){const i=name.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(name);return esc(name.slice(0,i))+'<span class="pshit">'+esc(name.slice(i,i+q.length))+'</span>'+esc(name.slice(i+q.length));}
function psShow(input,state){const f=input.closest('.field');if(!f)return;if(!PS.box||!f.contains(PS.box)){PS.box?.remove();PS.box=document.createElement('div');PS.box.className='psbox';PS.box.setAttribute('role','listbox');f.appendChild(PS.box);}
 const q=psTerm(input);let html='';
 if(state==='loading')html='<div class="psmsg"><span class="spin" aria-hidden="true"></span>Searching…</div>';
 else if(state==='error')html='<div class="psmsg">Search is not working right now. Type the name instead.</div>';
 else if(!PS.items.length)html='<div class="psmsg">No matching places. Check the spelling or type the name.</div>';
 else html=PS.items.map((it,i)=>`<button type="button" class="psitem ${i===PS.sel?'on':''}" role="option" aria-selected="${i===PS.sel}" data-psi="${i}">${icon('map-pin')}<span><b>${psHi(it.name,q)}</b><small>${esc(it.address)}</small></span></button>`).join('');
 PS.box.innerHTML=html+'<div class="psgoogle">Powered by Google</div>';}
async function psQuery(input){const q=psTerm(input);clearTimeout(PS.timer);if(q.length<3){psClose();return;}
 if(PS.key===null)return;PS.input=input;if(!PS.token)PS.token=psNewToken();
 PS.timer=setTimeout(async()=>{const g=++PS.gen;if(!PS.items.length)psShow(input,'loading');try{const items=await psSuggest(q);if(g!==PS.gen||document.activeElement!==input)return;PS.items=items;PS.sel=-1;psShow(input,'ok');}catch(e){if(g!==PS.gen)return;if(String(e.message)==='off'){psClose();return;}PS.items=[];psShow(input,'error');}},350);}
async function psPick(i){const it=PS.items[i],input=PS.input;if(!it||!input)return;const lid=input.dataset.lead;const l=S.byId.get(lid)||(S.modal?.lead?.id===lid?S.modal.lead:null);if(!l)return;const d=draftOf(l);const owner=d.details.kind==='owner';
 psClose();if(input.dataset.field==='locality'){PS.token=null;input.value=it.name;d.details.locality=it.name;d.autoArea='';input.closest('.field')?.classList.add('ok');if(S.byId.has(lid)){queueSave(l);recheckSoon(lid);}input.focus();return;}
 let det=null;try{det=await psDetails(it.id);}catch(e){}PS.token=null;
 const name=(det?.name||it.name).trim();
 if(owner)input.value=name;else{const parts=input.value.split(',').map(s=>s.trim()).filter(Boolean);parts.pop();parts.push(name);input.value=parts.join(', ');}
 d.details.society=input.value;input.closest('.field')?.classList.add('ok');
 if(owner){const area=areaFor(name)||[det?.area,det?.area&&det?.city&&det.city!=='Hyderabad'?det.city:''].filter(Boolean).join(', ')||'';const cur=String(d.details.locality||'');if(area&&(!cur||cur===d.autoArea)){d.details.locality=area;d.autoArea=area;const li=input.closest('[data-card],.modal')?.querySelector('[data-field="locality"]');if(li){li.value=area;li.closest('.field')?.classList.add('ok');}}}
 if(S.byId.has(lid)){queueSave(l);refreshEss(lid);recheckSoon(lid);}input.focus();}
document.addEventListener('keydown',e=>{if(!PS.box||e.target!==PS.input)return;const n=PS.items.length;if(e.key==='ArrowDown'&&n){e.preventDefault();PS.sel=(PS.sel+1)%n;psShow(PS.input,'ok');}else if(e.key==='ArrowUp'&&n){e.preventDefault();PS.sel=(PS.sel-1+n)%n;psShow(PS.input,'ok');}else if(e.key==='Enter'&&PS.sel>=0){e.preventDefault();psPick(PS.sel);}else if(e.key==='Escape'){psClose();}});

/* ===== Calendar drop-down for every DD/MM/YYYY date box; native date boxes open their picker on click ===== */
const CAL={input:null,box:null,m:null};
const CAL_MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function calClose(){CAL.box?.remove();CAL.box=null;CAL.input=null;}
function calOpen(input){const iso=date(input.value);const base=iso?new Date(iso+'T12:00:00'):new Date();CAL.input=input;CAL.m=new Date(base.getFullYear(),base.getMonth(),1);calDraw();}
function calDraw(){const input=CAL.input;if(!input)return;const host=input.closest('.field,.ctl')||input.parentElement;if(!CAL.box||!host.contains(CAL.box)){CAL.box?.remove();CAL.box=document.createElement('div');CAL.box.className='calbox';CAL.box.setAttribute('role','dialog');CAL.box.setAttribute('aria-label','Choose a date');host.appendChild(CAL.box);}
 const y=CAL.m.getFullYear(),mo=CAL.m.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),sel=date(input.value),td=today();
 const cells=[];for(let i=0;i<first;i++)cells.push('<span></span>');for(let d=1;d<=days;d++){const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells.push(`<button type="button" class="cd ${iso===sel?'sel':''} ${iso===td?'today':''} ${iso<td?'past':''}" data-cal="${iso}" aria-label="${d} ${CAL_MON[mo]} ${y}">${d}</button>`);}
 CAL.box.innerHTML=`<div class="calhead"><button type="button" class="calnav" data-calnav="-1" aria-label="Previous month">${icon('chevron-left')}</button><span class="calsel"><select data-calm="1" aria-label="Month">${CAL_MON.map((x,i)=>`<option value="${i}" ${i===mo?'selected':''}>${x}</option>`).join('')}</select><select data-caly="1" aria-label="Year">${(()=>{const now=new Date().getFullYear(),a=[];for(let yy=Math.min(now-10,y);yy<=Math.max(now+10,y);yy++)a.push(`<option ${yy===y?'selected':''}>${yy}</option>`);return a.join('');})()}</select></span><button type="button" class="calnav" data-calnav="1" aria-label="Next month">${icon('chevron-right')}</button></div><div class="calwk">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calgrid">${cells.join('')}</div><div class="calfoot"><button type="button" class="btn link" data-cal="${td}">Today</button><button type="button" class="btn link" data-calclear="1">Clear</button></div>`;}
function calSet(iso){const input=CAL.input;if(!input)return;input.value=iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));calClose();}

function hpUpdate(id){const box=document.getElementById('hp-'+id);if(!box)return;const l=S.byId.get(id)||(S.modal?.lead?.id===id?S.modal.lead:null);if(!l)return;const d=draftOf(l);box.hidden=!(d.discussion||d.followup||d.followupNote);const disc=box.querySelector('[data-hp=disc]');if(disc)disc.innerHTML=esc(d.discussion)||'<span class="none">Nothing written yet</span>';const nx=box.querySelector('[data-hp=next] span');if(nx)nx.innerHTML=`<b>Next follow-up${d.followup?' · '+shownDate(d.followup):''}</b>${d.followupNote?' — '+esc(d.followupNote):''}`;}
function coach(el,msg){if(!el)return;el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('coach');void el.offsetWidth;el.classList.add('coach');setTimeout(()=>el.classList.remove('coach'),3400);if(/TEXTAREA|INPUT/.test(el.tagName))setTimeout(()=>el.focus({preventScroll:true}),450);if(msg)toast(msg);}

 if(RAGE.t.length>=3&&now-RAGE.last>8000&&RAGE.t.every(p=>Math.hypot(p.x-e.clientX,p.y-e.clientY)<60)){RAGE.last=now;RAGE.t=[];

},true);

function moreTabs(l,html){const parts=html.split(/(?=<section class="fgroup)/).filter(s=>s.trim());if(parts.length<3)return html;const first=parts[0],rest=parts.slice(1);
 const titles=rest.map(s=>((s.match(/<h4>([^<]*)<\/h4>/)||[])[1]||'More').replace(/&amp;/g,'&'));S.moreTab=S.moreTab||{};let cur=S.moreTab[l.id];if(cur==null||cur>=rest.length)cur=0;
 const filled=s=>/value="[^"]+"|class="chip1 on|checked|class="ptile(?! add)/.test(s);
 return first+`<div class="moretabs" role="tablist" aria-label="More details">${titles.map((t,i)=>`<button type="button" role="tab" aria-selected="${i===cur}" class="${i===cur?'on':''}" data-moretab="${i}" data-lead="${esc(l.id)}">${esc(t)}${filled(rest[i])?'<span class="mdot" aria-label="has details"></span>':''}</button>`).join('')}</div><div class="morepanes">${rest.map((s,i)=>`<div class="mpane" ${i===cur?'':'hidden'} role="tabpanel">${s}</div>`).join('')}</div>`;}
